name: tests

# Lint and the unit tests on CPU. Tests that need FLAME 2020 skip (FLAME cannot be
# redistributed); run them locally after placing generic_model.pkl in model/FLAME2020/.
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple -r requirements.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
